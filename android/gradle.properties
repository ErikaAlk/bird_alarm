# 堆：原来写的 -Xmx8G -XX:MaxMetaspaceSize=4G。这机器 31G 内存平时只剩 ~3G 空闲，
# 8G 堆根本装不下，守护进程要么起不来、要么一边构建一边换页。这个工程很小，4G 绰绰有余。
# preferIPv4Stack：Gradle 守护进程默认优先走 IPv6 回环，留着无害。但**别指望这行能修好
# Windows 侧的 "Unable to establish loopback connection"**——2026-07-30 实测：有这行、再额外设
# GRADLE_OPTS=-Djava.net.preferIPv4Stack=true，Windows 上照样起不来（沙箱内外都一样）。
# Windows 端 Gradle 构建不通，APK 一律在 WSL2 Arch 里出，见 CLAUDE.md「构建环境」。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# enableJetifier 是把老 support-library 依赖改写成 AndroidX 的兼容层，每次构建都要过一遍所有依赖。
# 本项目的插件（audioplayers / file_picker / path_provider / shared_preferences / url_launcher）
# 全是 AndroidX 的，用不上。哪天引入了还在用 support-library 的老插件再打开。
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
